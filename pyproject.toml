[project]
name = "dagster-template-project"
version = "0.1.0"
description = "Dagster pipeline template using DuckDB and Pandas."
authors = [
    { name = "Tiago Sousa", email = "tas.tiago.sousa@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = { text = "MIT" }

dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-duckdb>=0.23.0",
    "dagster-pandas>=0.23.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/tabsa/dagster-template-project"
Repository = "https://github.com/tabsa/dagster-template-project"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
